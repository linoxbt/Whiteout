name: Install the Sui CLI
description: Downloads a pinned Sui CLI release and puts it on PATH.
inputs:
  version:
    description: Sui release tag. Pinned so builds and published bytecode are reproducible.
    default: testnet-v1.84.1
runs:
  using: composite
  steps:
    - shell: bash
      env:
        TAG: ${{ inputs.version }}
      run: |
        echo "Sui release: $TAG"
        mkdir -p "$RUNNER_TEMP/sui"
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/sui/sui.tgz" \
          "https://github.com/MystenLabs/sui/releases/download/$TAG/sui-$TAG-ubuntu-x86_64.tgz"
        tar -xzf "$RUNNER_TEMP/sui/sui.tgz" -C "$RUNNER_TEMP/sui" ./sui
        chmod +x "$RUNNER_TEMP/sui/sui"
        "$RUNNER_TEMP/sui/sui" --version
        echo "$RUNNER_TEMP/sui" >> "$GITHUB_PATH"
