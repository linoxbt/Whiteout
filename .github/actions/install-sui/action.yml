name: Install the Sui CLI
description: Downloads the latest testnet release of the Sui CLI and puts it on PATH.
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        TAG=$(gh release list --repo MystenLabs/sui --limit 60 --json tagName \
          --jq '[.[] | select(.tagName | startswith("testnet-"))][0].tagName')
        echo "Sui release: $TAG"
        mkdir -p "$RUNNER_TEMP/sui"
        gh release download "$TAG" --repo MystenLabs/sui \
          --pattern '*ubuntu-x86_64.tgz' --dir "$RUNNER_TEMP/sui"
        tar -xzf "$RUNNER_TEMP"/sui/*.tgz -C "$RUNNER_TEMP/sui"
        SUI_BIN=$(find "$RUNNER_TEMP/sui" -type f -name sui | head -1)
        chmod +x "$SUI_BIN"
        dirname "$SUI_BIN" >> "$GITHUB_PATH"
