name: ci

on:
  push:
  pull_request:

jobs:
  move:
    name: Move build and tests
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the Sui CLI (latest testnet release)
        run: |
          TAG=$(gh release list --repo MystenLabs/sui --limit 60 --json tagName \
            --jq '[.[] | select(.tagName | startswith("testnet-"))][0].tagName')
          echo "Sui release: $TAG"
          mkdir -p "$RUNNER_TEMP/sui"
          gh release download "$TAG" --repo MystenLabs/sui \
            --pattern '*ubuntu-x86_64.tgz' --dir "$RUNNER_TEMP/sui"
          tar -xzf "$RUNNER_TEMP"/sui/*.tgz -C "$RUNNER_TEMP/sui"
          SUI_BIN=$(find "$RUNNER_TEMP/sui" -type f -name sui | head -1)
          chmod +x "$SUI_BIN"
          dirname "$SUI_BIN" >> "$GITHUB_PATH"

      - name: Check fixtures are up to date
        run: |
          pip install --quiet cryptography
          python3 move/whiteout/scripts/gen_fixtures.py
          git diff --exit-code move/whiteout/tests/fixtures.move

      - name: Build
        run: sui move build --path move/whiteout

      - name: Test
        run: sui move test --path move/whiteout
